[project]
name = "scanomatic"
version = "3.0.0"
description = "High Throughput Solid Media Image Phenotyping Platform"
readme = "README.md"
authors = [
    { name = "Martin Zackrisson", email = "martin.zackrisson@gu.se" },
]
classifiers=[
    "Development Status :: 7 - Inactive",
    "Environment :: Web Environment",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Natural Language :: English",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.9",
    "Topic :: Scientific/Engineering :: Bio-Informatics"
]
requires-python = "==3.9.*"
dependencies = [
    "click==8.0.3",
    "flask==2.0.2",
    "flask-cors==3.0.10",
    "flask-restful==0.3.9",
    "matplotlib==3.4.3",
    "numpy==1.21.3",
    "pandas==1.3.4",
    "pillow==9.0.0",
    "psutil==5.8.0",
    "python-dateutil==2.8.2",
    "python-nmap==0.7.1",
    "requests==2.26.0",
    "scikit-image==0.18.3",
    "scipy==1.7.1",
    "setproctitle==1.2.2",
    "werkzeug==2.0.2",
]

[project.scripts]
scan-o-matic = "scanomatic.scripts.scan_o_matic:main"
scan-o-matic_server = "scanomatic.scripts.scan_o_matic_server:main"

[project.urls]
Repository = "https://github.com/scan-o-matic/scannomatic-standalone"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pandas-stubs>=1.2.0.40",
    "py-spy>=0.4.1",
    "pytest>=8.4.2",
    "ruff>=0.15.10",
    "ty>=0.0.29",
    "types-chardet>=4.0.1",
    "types-pillow>=8.3.7",
    "types-psutil>=5.8.13",
    "types-python-dateutil>=2.8.2",
    "types-python-nmap>=0.6.2",
    "types-requests>=2.25.11",
]
